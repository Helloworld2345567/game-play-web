name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Run Worker integration tests
        run: npm run test:worker

      - name: Install browser test dependencies
        run: npx playwright install --with-deps chrome

      - name: Run browser end-to-end tests
        # Keep the local Vite/Worker test server and its in-process Durable
        # Objects responsive on shared runners. A single browser worker avoids
        # cross-test state contention while preserving the full production gate.
        run: npm run test:e2e -- --workers=1
        env:
          SESSION_SECRET: github-actions-e2e-only-secret-with-enough-entropy

      - name: Build production bundle
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: deploy

  smoke:
    name: Smoke-test public security headers
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify the public page without sending credentials
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
            -D - -o /dev/null https://play.ym0v0.com/)"
          grep -Fqi 'strict-transport-security: max-age=31536000' <<< "$headers"
          grep -Fqi 'cross-origin-resource-policy: same-origin' <<< "$headers"
